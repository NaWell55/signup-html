<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This My First HTML!</title>
</head>
<body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name"
        placeholder="Will" required>

        <br><br>
        
        <label for="lname">Last Name:</label>
        <input type="text" name="lname" id="lname"
        placeholder="Smith">

        <br><br>

        <label for="pssword">Password:</label>
        <input type="password" name="pssword" id="pssword"
        placeholder="*******" maxlength="15">

        <br><br>

        <label for="mail">E-Mail:</label>
        <input type="email" name="mail" id="mail"
        placeholder="ex@gmail.com">

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" name="phone" id="phone"
        placeholder="+1 (212) 555-0199">

        <br><br>

        <label for="date">Birthday:</label>
        <input type="date" name="date" id="date">

        <br><br>

        <label for="bro">Number of Siblings:</label>
        <input type="number" name="bro" id="bro"
        min="0" max="30">

        <br><br>

        <label for="gender">Gender:</label>
        <label for="female">Female</label>
        <input type="radio" name="gender" id="gender" value="female">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="gender" value="male">
        
        <br><br>

        <label for="">Have school?</label>
        <input type="checkbox">

        <br><br>
        
        <label for="loaciton">Location:</label>

        <br>

        <textarea name="" id="" cols="15" rows="5"></textarea>

        <br><br>

        <input type="file" accept=".pdf">

        <input type="reset">
        <input type="submit">
    </form>
</body>
</html>
